id: Prabal-Urja-S05-Service-Availability
name: OT-S05-Native-MMS-Protection
description: Checks native MMS connectivity and actual protection failure after the instructor fault test.
tactic: impact
technique_id: T0832
technique_name: Manipulation of Control
tag: service-availability

executors:
- name: sh
  platform: linux
  command: set +e; f=/var/lib/prabal-urja/scenario5/relay-state.json; c=/opt/prabal-urja/scenario5/bin/pu_s05_mms_client; o=0; if [ ! -x "$c" ]; then echo "CHECK:NATIVE_MMS_PROBE:SKIP | CLIENT_MISSING:$c"; else x=$(timeout 8 "$c" 127.0.0.1 102 2>&1); r=$?; if [ "$r" -ne 0 ]; then echo "CHECK:NATIVE_MMS_PROBE:FAIL | EXIT_$r | ${x:-NO_OUTPUT}"; o=1; elif ! printf "%s\n" "$x" | grep -q "^MMS_READ_OK"; then echo "CHECK:NATIVE_MMS_PROBE:FAIL | INVALID_OUTPUT | ${x:-NO_OUTPUT}"; o=1; else echo "CHECK:NATIVE_MMS_PROBE:PASS"; fi; fi; if ss -ltn 2>/dev/null | grep -Eq "(:102[[:space:]]|:102$)"; then echo "CHECK:MMS_LISTENER_102:PASS"; else echo "CHECK:MMS_LISTENER_102:SKIP | LISTENER_MISSING"; fi; if [ ! -r "$f" ]; then echo "CHECK:IED_STATE:SKIP | FILE_MISSING_OR_UNREADABLE:$f"; echo "CHECK:IED_STATE_FRESHNESS:SKIP | STATE_UNAVAILABLE"; echo "CHECK:ACTIVE_SETTING_GROUP:SKIP | STATE_UNAVAILABLE"; echo "CHECK:PROTECTION_TRIP:SKIP | STATE_UNAVAILABLE"; echo "CHECK:PROTECTION_SUPPRESSION:SKIP | STATE_UNAVAILABLE"; elif ! jq -e . "$f" >/dev/null 2>&1; then echo "CHECK:IED_STATE:FAIL | INVALID_JSON:$f"; o=1; else echo "CHECK:IED_STATE:PASS"; if jq -e --argjson now "$(date +%s)" '(.epoch | type) == "number" and ($now - .epoch >= 0) and ($now - .epoch < 5)' "$f" >/dev/null 2>&1; then echo "CHECK:IED_STATE_FRESHNESS:PASS"; else echo "CHECK:IED_STATE_FRESHNESS:FAIL | MISSING_OR_STALE"; o=1; fi; if jq -e '.active_setting_group == 2' "$f" >/dev/null 2>&1; then echo "CHECK:ACTIVE_SETTING_GROUP:PASS"; else echo "CHECK:ACTIVE_SETTING_GROUP:FAIL | ACTUAL:$(jq -r '.active_setting_group // "MISSING"' "$f")"; o=1; fi; if jq -e '.last_test_group == 2 and .last_test_trip == false and .breaker_closed == true' "$f" >/dev/null 2>&1; then echo "CHECK:PROTECTION_TRIP:PASS"; else echo "CHECK:PROTECTION_TRIP:FAIL | TRIP_NOT_OBSERVED"; o=1; fi; if jq -e '(.last_test_current_amps // 0) > 800 and .last_test_group == 2 and .last_test_trip == false and .breaker_closed == true' "$f" >/dev/null 2>&1; then echo "CHECK:PROTECTION_SUPPRESSION:FAIL | RESPONSE_SUPPRESSED"; o=1; else echo "CHECK:PROTECTION_SUPPRESSION:PASS"; fi; fi; if [ "$o" -eq 0 ]; then echo "SERVICE_STATUS:UP | REASON:AVAILABLE_CHECKS_PASSED"; exit 0; fi; echo "SERVICE_STATUS:DOWN | REASON:DIAGNOSTIC_FAILURES"; exit 1
  payloads: []
  parsers: []
